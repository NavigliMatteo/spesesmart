<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpeseSmart">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <title>SpeseSmart</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    :root {
      --blue:#2563eb; --blue-l:#eff6ff; --blue-d:#1d4ed8;
      --green:#16a34a; --orange:#f97316; --purple:#9333ea;
      --pink:#ec4899; --teal:#0d9488; --amber:#d97706; --gray:#6b7280;
      --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b;
      --border:#e2e8f0; --radius:14px; --nav-h:64px;
      --sat: env(safe-area-inset-top,0px);
      --sab: env(safe-area-inset-bottom,0px);
    }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text); overflow:hidden; }

    /* ── LAYOUT ── */
    #app { display:flex; flex-direction:column; height:100%; padding-top:var(--sat); }
    header {
      background:var(--card); border-bottom:1px solid var(--border);
      padding:14px 16px 12px; display:flex; align-items:center; justify-content:space-between;
      flex-shrink:0;
    }
    header h1 { font-size:20px; font-weight:600; color:var(--blue); letter-spacing:-0.3px; }
    header .subtitle { font-size:12px; color:var(--muted); margin-top:1px; }
    main { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
    .page { padding:16px; display:none; }
    .page.active { display:block; }
    nav {
      background:var(--card); border-top:1px solid var(--border);
      display:flex; height:calc(var(--nav-h) + var(--sab));
      padding-bottom:var(--sab); flex-shrink:0;
    }
    .nav-btn {
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; background:none; border:none;
      cursor:pointer; color:var(--muted); font-size:10px; font-weight:500;
      font-family:inherit; padding:0; transition:color 0.15s;
    }
    .nav-btn .icon { font-size:22px; line-height:1; }
    .nav-btn.active { color:var(--blue); }

    /* ── CARDS ── */
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
    .card-title { font-size:12px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }

    /* ── DASHBOARD ── */
    .month-picker { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .month-picker button { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer; font-family:inherit; }
    .month-label { font-size:16px; font-weight:600; }
    .total-amount { font-size:36px; font-weight:700; color:var(--text); letter-spacing:-1px; margin:4px 0 2px; }
    .total-sub { font-size:13px; color:var(--muted); }
    .cat-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .cat-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .cat-name { font-size:13px; font-weight:500; width:88px; flex-shrink:0; }
    .cat-bar-bg { flex:1; background:var(--bg); border-radius:99px; height:8px; overflow:hidden; }
    .cat-bar { height:100%; border-radius:99px; transition:width 0.4s ease; }
    .cat-amount { font-size:12px; color:var(--muted); width:64px; text-align:right; flex-shrink:0; }
    .trend-grid { display:flex; align-items:flex-end; gap:6px; height:80px; }
    .trend-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .trend-bar-wrap { flex:1; width:100%; display:flex; align-items:flex-end; }
    .trend-bar { width:100%; border-radius:4px 4px 0 0; background:var(--blue); opacity:0.2; min-height:2px; transition:height 0.4s ease; }
    .trend-bar.current { opacity:1; }
    .trend-label { font-size:9px; color:var(--muted); }
    .merchants-list { list-style:none; }
    .merchant-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); gap:8px; }
    .merchant-row:last-child { border-bottom:none; }
    .merchant-name { font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .merchant-amt { font-size:13px; font-weight:600; flex-shrink:0; }
    .empty-state { text-align:center; padding:48px 16px; color:var(--muted); }
    .empty-state .emoji { font-size:48px; display:block; margin-bottom:12px; }
    .empty-state p { font-size:14px; line-height:1.6; }
    .empty-state .cta { margin-top:16px; display:inline-block; padding:10px 20px; background:var(--blue); color:#fff; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; border:none; font-family:inherit; }

    /* ── TRANSACTIONS ── */
    .search-bar { position:relative; margin-bottom:12px; }
    .search-bar input { width:100%; padding:10px 12px 10px 36px; border:1px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; background:var(--card); color:var(--text); outline:none; }
    .search-bar input:focus { border-color:var(--blue); }
    .search-bar .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none; }
    .filter-row { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
    .filter-row::-webkit-scrollbar { display:none; }
    .filter-chip { padding:5px 12px; border:1px solid var(--border); border-radius:99px; font-size:12px; font-weight:500; background:var(--card); color:var(--muted); cursor:pointer; white-space:nowrap; font-family:inherit; transition:all 0.15s; flex-shrink:0; }
    .filter-chip.active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .tx-list { list-style:none; }
    .tx-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
    .tx-item:last-child { border-bottom:none; }
    .tx-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .tx-info { flex:1; min-width:0; }
    .tx-merchant { font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tx-date { font-size:12px; color:var(--muted); margin-top:2px; }
    .tx-cat-badge { font-size:10px; padding:2px 7px; border-radius:99px; display:inline-block; margin-top:3px; font-weight:500; }
    .tx-amount { font-size:15px; font-weight:600; flex-shrink:0; }
    .tx-amount.negative { color:#ef4444; }
    .tx-amount.positive { color:var(--green); }

    /* ── UPLOAD ── */
    .drop-zone {
      border:2px dashed var(--border); border-radius:var(--radius);
      padding:40px 20px; text-align:center; cursor:pointer;
      transition:all 0.2s; background:var(--card); margin-bottom:16px;
    }
    .drop-zone.drag-over { border-color:var(--blue); background:var(--blue-l); }
    .drop-zone .dz-icon { font-size:40px; display:block; margin-bottom:12px; }
    .drop-zone .dz-title { font-size:16px; font-weight:600; margin-bottom:6px; }
    .drop-zone .dz-sub { font-size:13px; color:var(--muted); line-height:1.5; }
    #file-input { display:none; }
    .btn { padding:12px 20px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; transition:all 0.15s; width:100%; }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-primary:hover { background:var(--blue-d); }
    .btn-secondary { background:var(--bg); color:var(--text); border:1px solid var(--border); }
    .preview-table-wrap { overflow-x:auto; margin-bottom:12px; border:1px solid var(--border); border-radius:10px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { background:var(--bg); padding:8px 10px; text-align:left; font-weight:600; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:8px 10px; border-bottom:1px solid var(--border); }
    tr:last-child td { border-bottom:none; }
    .preview-more { text-align:center; padding:8px; font-size:12px; color:var(--muted); }
    .alert { padding:12px 14px; border-radius:10px; font-size:13px; margin-bottom:12px; line-height:1.5; }
    .alert-error { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
    .alert-success { background:#f0fdf4; color:var(--green); border:1px solid #bbf7d0; }
    .alert-info { background:var(--blue-l); color:var(--blue-d); border:1px solid #bfdbfe; }
    .stat-row { display:flex; gap:10px; margin-bottom:12px; }
    .stat-box { flex:1; background:var(--bg); border-radius:10px; padding:12px; text-align:center; }
    .stat-box .stat-n { font-size:22px; font-weight:700; color:var(--blue); }
    .stat-box .stat-l { font-size:11px; color:var(--muted); margin-top:2px; }
    .banks-info { font-size:12px; color:var(--muted); line-height:1.7; margin-top:12px; }
    .banks-info span { display:inline-block; margin-right:8px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>💳 SpeseSmart</h1>
      <div class="subtitle" id="header-sub">Carica un CSV per iniziare</div>
    </div>
  </header>

  <main>
    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page active">
      <div class="month-picker">
        <button id="prev-month">‹</button>
        <span class="month-label" id="month-label">—</span>
        <button id="next-month">›</button>
      </div>
      <div id="dashboard-content"></div>
    </div>

    <!-- TRANSACTIONS -->
    <div id="page-transactions" class="page">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" placeholder="Cerca transazione…">
      </div>
      <div class="filter-row" id="filter-row"></div>
      <ul class="tx-list" id="tx-list"></ul>
    </div>

    <!-- UPLOAD -->
    <div id="page-upload" class="page">
      <div class="drop-zone" id="drop-zone">
        <span class="dz-icon">📂</span>
        <div class="dz-title">Carica estratto conto CSV</div>
        <div class="dz-sub">Trascina qui il file o tocca per selezionarlo<br>Supporta Fineco, UniCredit, Intesa, BancaSella e altri</div>
      </div>
      <input type="file" id="file-input" accept=".csv,.txt">
      <div id="upload-feedback"></div>
      <div class="banks-info">
        Banche supportate:
        <span>✓ Fineco</span><span>✓ UniCredit</span><span>✓ Intesa SP</span>
        <span>✓ BancaSella</span><span>✓ Mediolanum</span><span>✓ Qualsiasi CSV standard</span>
      </div>
    </div>
  </main>

  <nav>
    <button class="nav-btn active" data-page="dashboard"><span class="icon">📊</span>Dashboard</button>
    <button class="nav-btn" data-page="transactions"><span class="icon">📋</span>Movimenti</button>
    <button class="nav-btn" data-page="upload"><span class="icon">⬆️</span>Carica CSV</button>
  </nav>
</div>

<script>
/* ── CATEGORIES ──────────────────────────────────────────────────────────── */
const CAT = {
  alimentari: { label:'Alimentari', color:'#16a34a', emoji:'🛒',
    kw:['esselunga','coop','carrefour','lidl','conad','aldi','eurospin','pam','iper','supermercato','penny','bennet','simply','tigros','mercato','alimentari','frutta'] },
  ristoranti: { label:'Ristoranti', color:'#f97316', emoji:'🍕',
    kw:['pizzeria','ristorante','trattoria','osteria','bar ','cafe','caffè','caffe','mcdonald','burger','kfc','sushi','poke','subway','starbucks','gelateria','pasticceria','panificio','kebab','rosticceria'] },
  trasporti: { label:'Trasporti', color:'#2563eb', emoji:'🚆',
    kw:['trenitalia','italo','atm','uber','taxi','parking','parcheggio','autostrada','agip','eni ','q8','shell','ip ','tamoil','telepass','flixbus','blablacar','ryanair','easyjet','alitalia','ita airways','atac','amt','gtt','autobus','treno','volo','aeroporto','benzina','carburante'] },
  shopping: { label:'Shopping', color:'#9333ea', emoji:'🛍️',
    kw:['amazon','zara','h&m','zalando','ikea','primark','mediaworld','unieuro','decathlon','footlocker','oviesse','bershka','pull&bear','mango','uniqlo','shein','asos','ebay','aliexpress','coin','rinascente','luisa spagnoli'] },
  salute: { label:'Salute', color:'#ec4899', emoji:'💊',
    kw:['farmacia','medico','dentista','sanitaria','ottica','fisioterapia','ospedale','asl','clinica','ambulatorio','laboratorio','analisi','parafarmacia','erboristeria'] },
  svago: { label:'Svago', color:'#0d9488', emoji:'🎬',
    kw:['netflix','spotify','cinema','teatro','disney','dazn','sky ','ticketmaster','ticketone','playstation','nintendo','steam','apple ','youtube','amazon prime','palestra','gym','fitness','sport','giochi','abbonamento'] },
  bollette: { label:'Bollette', color:'#d97706', emoji:'⚡',
    kw:['enel','a2a','eni gas','edison','hera','iren','acea','tim ','vodafone','iliad','wind','fastweb','tiscali','telecom','luce','gas ','acqua','condominio','affitto','mutuo','assicurazione','rc auto','inps','irpef','comune'] },
};
const CAT_ALTRO = { label:'Altro', color:'#6b7280', emoji:'📦' };

function categorize(merchant) {
  const m = (merchant || '').toLowerCase();
  for (const [key, { kw }] of Object.entries(CAT)) {
    if (kw.some(k => m.includes(k))) return key;
  }
  return 'altro';
}
function getCat(key) { return CAT[key] || CAT_ALTRO; }

/* ── STORAGE ─────────────────────────────────────────────────────────────── */
const store = {
  get() {
    try { return JSON.parse(localStorage.getItem('ss_tx') || '[]'); }
    catch { return []; }
  },
  set(data) {
    try { localStorage.setItem('ss_tx', JSON.stringify(data)); return true; }
    catch (e) { showAlert('upload-feedback', '⚠️ Spazio insufficiente sul dispositivo: impossibile salvare.', 'error'); return false; }
  },
  add(rows) {
    const existing = store.get();
    const keys = new Set(existing.map(r => `${r.date}|${r.amount}|${r.merchant.substring(0,20)}`));
    const fresh = rows.filter(r => !keys.has(`${r.date}|${r.amount}|${r.merchant.substring(0,20)}`));
    if (!store.set([...existing, ...fresh].sort((a,b) => b.date.localeCompare(a.date)))) return null;
    return { added: fresh.length, skipped: rows.length - fresh.length };
  }
};

/* ── CSV PARSER ──────────────────────────────────────────────────────────── */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) throw new Error('File vuoto o non valido (meno di 2 righe).');

  // Detect separator
  const sample = lines[0];
  const sep = (sample.split(';').length - 1) >= (sample.split(',').length - 1) ? ';' : ',';

  function parseLine(line) {
    const cols = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === sep && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  }

  const rawHeaders = parseLine(lines[0]);
  const headers = rawHeaders.map(h => h.toLowerCase().replace(/['"]/g, '').trim());

  const find = (...names) => headers.findIndex(h => names.includes(h));
  const iDate = find('data','date','data valuta','data operazione','data contabile','data mov');
  const iDesc = find('descrizione','description','causale','dettagli','operazione','movimento','beneficiario','intestatario');
  const iAmt  = find('importo','amount','importo eur','importo in euro');
  const iOut  = find('uscite','addebiti','dare','spese','importo dare');
  const iIn   = find('entrate','accrediti','avere','importo avere');

  if (iDate === -1) throw new Error(`Colonna data non trovata. Intestazioni: ${headers.slice(0,8).join(', ')}`);
  if (iDesc === -1) throw new Error(`Colonna descrizione non trovata. Intestazioni: ${headers.slice(0,8).join(', ')}`);
  if (iAmt === -1 && (iOut === -1 && iIn === -1))
    throw new Error(`Colonna importo non trovata. Intestazioni: ${headers.slice(0,8).join(', ')}`);

  function parseDate(s) {
    s = (s || '').replace(/['"]/g, '').trim();
    let m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    m = s.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})$/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return null;
  }

  function parseAmt(s) {
    if (!s && s !== 0) return null;
    s = String(s).replace(/['"€\s]/g, '');
    if (!s) return null;
    // Italian format: 1.234,56 → 1234.56
    if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    else if (/,\d{2}$/.test(s) && !/\./.test(s)) s = s.replace(',', '.');
    else if (/,/.test(s) && !/\./.test(s)) s = s.replace(',', '.');
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  const txs = [];
  for (const line of lines.slice(1)) {
    if (!line.trim()) continue;
    const cols = parseLine(line);
    const date = parseDate(cols[iDate]);
    if (!date) continue;
    const merchant = (cols[iDesc] || '').replace(/^["']|["']$/g, '').trim();
    if (!merchant || merchant.toLowerCase() === 'nan') continue;

    let amount = null;
    if (iAmt !== -1) {
      amount = parseAmt(cols[iAmt]);
    } else {
      const out = parseAmt(iOut !== -1 ? cols[iOut] : null);
      const inn = parseAmt(iIn  !== -1 ? cols[iIn]  : null);
      if (out && out > 0) amount = -Math.abs(out);
      else if (inn && inn > 0) amount = Math.abs(inn);
    }
    if (amount === null || amount === undefined) continue;

    txs.push({ date, merchant, amount, category: categorize(merchant) });
  }
  if (txs.length === 0) throw new Error('Nessuna transazione valida trovata nel file.');
  return txs;
}

/* ── HELPERS ─────────────────────────────────────────────────────────────── */
function fmt(n) {
  return new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR' }).format(Math.abs(n));
}
function fmtMonth(ym) {
  const [y, m] = ym.split('-');
  const d = new Date(+y, +m - 1, 1);
  return d.toLocaleDateString('it-IT', { month:'long', year:'numeric' });
}
function ym(date) { return date.substring(0, 7); }

function showAlert(containerId, msg, type = 'info') {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

/* ── STATE ───────────────────────────────────────────────────────────────── */
const state = {
  page: 'dashboard',
  currentMonth: new Date().toISOString().substring(0, 7),
  search: '',
  filterCat: '',
  preview: null,
};

/* ── NAVIGATION ──────────────────────────────────────────────────────────── */
function goTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.getElementById(`page-${page}`).classList.add('active');
  state.page = page;
  if (page === 'dashboard') renderDashboard();
  if (page === 'transactions') renderTransactions();
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => goTo(btn.dataset.page));
});

/* ── DASHBOARD ───────────────────────────────────────────────────────────── */
function renderDashboard() {
  const txs = store.get();
  document.getElementById('header-sub').textContent =
    txs.length > 0 ? `${txs.length} movimenti totali` : 'Carica un CSV per iniziare';
  document.getElementById('month-label').textContent = fmtMonth(state.currentMonth);

  const el = document.getElementById('dashboard-content');
  const monthTxs = txs.filter(t => ym(t.date) === state.currentMonth);

  if (txs.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <span class="emoji">📂</span>
      <p>Nessun dato ancora.<br>Carica il tuo primo CSV per vedere la dashboard.</p>
      <button class="cta" onclick="goTo('upload')">Carica CSV</button>
    </div>`;
    return;
  }

  if (monthTxs.length === 0) {
    el.innerHTML = `<div class="empty-state"><span class="emoji">🗓️</span><p>Nessun movimento in ${fmtMonth(state.currentMonth)}.</p></div>`;
    return;
  }

  const spese = monthTxs.filter(t => t.amount < 0);
  const entrate = monthTxs.filter(t => t.amount > 0);
  const totale = spese.reduce((s, t) => s + Math.abs(t.amount), 0);

  // Categories
  const catTotals = {};
  for (const t of spese) {
    catTotals[t.category] = (catTotals[t.category] || 0) + Math.abs(t.amount);
  }
  const catSorted = Object.entries(catTotals).sort((a,b) => b[1]-a[1]);
  const catRows = catSorted.map(([key, amt]) => {
    const c = getCat(key);
    const pct = totale > 0 ? (amt / totale * 100).toFixed(0) : 0;
    return `<div class="cat-row">
      <div class="cat-dot" style="background:${c.color}"></div>
      <div class="cat-name">${c.emoji} ${c.label}</div>
      <div class="cat-bar-bg"><div class="cat-bar" style="width:${pct}%;background:${c.color}"></div></div>
      <div class="cat-amount">${fmt(amt)}</div>
    </div>`;
  }).join('');

  // Monthly trend (last 6 months)
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(state.currentMonth + '-01');
    d.setMonth(d.getMonth() - i);
    months.push(d.toISOString().substring(0, 7));
  }
  const monthAmts = months.map(m => ({
    ym: m,
    amt: txs.filter(t => ym(t.date) === m && t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0)
  }));
  const maxAmt = Math.max(...monthAmts.map(m => m.amt), 1);
  const trendCols = monthAmts.map(({ ym: ymVal, amt }) => `
    <div class="trend-col">
      <div class="trend-bar-wrap">
        <div class="trend-bar${ymVal === state.currentMonth ? ' current' : ''}" style="height:${Math.round(amt/maxAmt*70)+2}px"></div>
      </div>
      <div class="trend-label">${ymVal.substring(5)}</div>
    </div>`).join('');

  // Top merchants
  const merchantAmt = {};
  for (const t of spese) {
    const k = t.merchant.substring(0, 25);
    merchantAmt[k] = (merchantAmt[k] || 0) + Math.abs(t.amount);
  }
  const topM = Object.entries(merchantAmt).sort((a,b) => b[1]-a[1]).slice(0, 5);
  const merchantRows = topM.map(([m, a]) => `
    <li class="merchant-row">
      <span class="merchant-name">${m}</span>
      <span class="merchant-amt" style="color:#ef4444">${fmt(a)}</span>
    </li>`).join('');

  el.innerHTML = `
    <div class="card">
      <div class="card-title">Spese ${fmtMonth(state.currentMonth)}</div>
      <div class="total-amount">${fmt(totale)}</div>
      <div class="total-sub">${spese.length} transazioni · ${entrate.length > 0 ? `${entrate.length} rimborsi (${fmt(entrate.reduce((s,t)=>s+t.amount,0))})` : 'nessun rimborso'}</div>
    </div>
    <div class="card">
      <div class="card-title">Categorie</div>
      ${catRows || '<p style="color:var(--muted);font-size:13px">Nessuna spesa</p>'}
    </div>
    <div class="card">
      <div class="card-title">Andamento ultimi 6 mesi</div>
      <div class="trend-grid">${trendCols}</div>
    </div>
    <div class="card">
      <div class="card-title">Top 5 negozi</div>
      <ul class="merchants-list">${merchantRows}</ul>
    </div>`;
}

/* ── TRANSACTIONS ────────────────────────────────────────────────────────── */
function renderTransactions() {
  const all = store.get();

  // Filter chips
  const filterEl = document.getElementById('filter-row');
  const allCats = [...new Set(all.map(t => t.category))];
  filterEl.innerHTML = `<button class="filter-chip${!state.filterCat ? ' active' : ''}" data-cat="">Tutti</button>` +
    allCats.map(c => {
      const cat = getCat(c);
      return `<button class="filter-chip${state.filterCat === c ? ' active' : ''}" data-cat="${c}">${cat.emoji} ${cat.label}</button>`;
    }).join('');
  filterEl.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => { state.filterCat = btn.dataset.cat; renderTransactions(); });
  });

  // Filter & search
  let txs = all;
  if (state.filterCat) txs = txs.filter(t => t.category === state.filterCat);
  if (state.search) {
    const q = state.search.toLowerCase();
    txs = txs.filter(t => t.merchant.toLowerCase().includes(q));
  }

  const listEl = document.getElementById('tx-list');
  if (txs.length === 0) {
    listEl.innerHTML = `<div class="empty-state" style="padding:32px 0"><span class="emoji" style="font-size:32px">🔍</span><p>${all.length === 0 ? 'Nessun movimento. Carica un CSV.' : 'Nessun risultato.'}</p></div>`;
    return;
  }

  listEl.innerHTML = txs.map(t => {
    const cat = getCat(t.category);
    const isNeg = t.amount < 0;
    const dateStr = new Date(t.date + 'T12:00:00').toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
    return `<li class="tx-item">
      <div class="tx-icon" style="background:${cat.color}22">${cat.emoji}</div>
      <div class="tx-info">
        <div class="tx-merchant">${t.merchant}</div>
        <div class="tx-date">${dateStr}</div>
        <span class="tx-cat-badge" style="background:${cat.color}22;color:${cat.color}">${cat.label}</span>
      </div>
      <div class="tx-amount ${isNeg ? 'negative' : 'positive'}">${isNeg ? '-' : '+'}${fmt(t.amount)}</div>
    </li>`;
  }).join('');
}

document.getElementById('search-input').addEventListener('input', e => {
  state.search = e.target.value;
  renderTransactions();
});

/* ── UPLOAD ──────────────────────────────────────────────────────────────── */
function handleFile(file) {
  if (!file || !file.name.match(/\.(csv|txt)$/i)) {
    showAlert('upload-feedback', '⚠️ Seleziona un file CSV o TXT.', 'error'); return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const txs = parseCSV(e.target.result);
      state.preview = txs;
      showPreview(txs, file.name);
    } catch (err) {
      showAlert('upload-feedback', `❌ Errore nel file: ${err.message}`, 'error');
    }
  };
  reader.onerror = () => showAlert('upload-feedback', '❌ Errore nella lettura del file.', 'error');
  reader.readAsText(file, 'UTF-8');
}

function showPreview(txs, filename) {
  const preview = txs.slice(0, 10);
  const tableRows = preview.map(t => {
    const cat = getCat(t.category);
    const isNeg = t.amount < 0;
    return `<tr>
      <td>${t.date}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.merchant}</td>
      <td style="color:${isNeg ? '#ef4444' : '#16a34a'};font-weight:600;text-align:right">${isNeg?'-':'+'}${fmt(t.amount)}</td>
      <td><span style="color:${cat.color}">${cat.emoji} ${cat.label}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('upload-feedback').innerHTML = `
    <div class="alert alert-info">📄 <strong>${filename}</strong> — ${txs.length} transazioni trovate</div>
    <div class="stat-row">
      <div class="stat-box"><div class="stat-n">${txs.filter(t=>t.amount<0).length}</div><div class="stat-l">Spese</div></div>
      <div class="stat-box"><div class="stat-n">${txs.filter(t=>t.amount>0).length}</div><div class="stat-l">Rimborsi</div></div>
      <div class="stat-box"><div class="stat-n">${new Set(txs.map(t=>ym(t.date))).size}</div><div class="stat-l">Mesi</div></div>
    </div>
    <div class="preview-table-wrap">
      <table><thead><tr><th>Data</th><th>Descrizione</th><th>Importo</th><th>Categoria</th></tr></thead>
      <tbody>${tableRows}</tbody></table>
      ${txs.length > 10 ? `<div class="preview-more">... e altri ${txs.length - 10} movimenti</div>` : ''}
    </div>
    <button class="btn btn-primary" id="confirm-import">✅ Importa ${txs.length} movimenti</button>
    <button class="btn btn-secondary" style="margin-top:8px" id="cancel-import">Annulla</button>`;

  document.getElementById('confirm-import').addEventListener('click', () => {
    const result = store.add(state.preview || []);
    if (result === null) return;
    showAlert('upload-feedback', `✅ Importati ${result.added} movimenti.${result.skipped > 0 ? ` (${result.skipped} duplicati ignorati)` : ''}`, 'success');
    state.preview = null;
    renderDashboard();
  });
  document.getElementById('cancel-import').addEventListener('click', () => {
    document.getElementById('upload-feedback').innerHTML = '';
    state.preview = null;
  });
}

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

/* ── MONTH NAV ───────────────────────────────────────────────────────────── */
document.getElementById('prev-month').addEventListener('click', () => {
  const d = new Date(state.currentMonth + '-01'); d.setMonth(d.getMonth() - 1);
  state.currentMonth = d.toISOString().substring(0, 7); renderDashboard();
});
document.getElementById('next-month').addEventListener('click', () => {
  const d = new Date(state.currentMonth + '-01'); d.setMonth(d.getMonth() + 1);
  state.currentMonth = d.toISOString().substring(0, 7); renderDashboard();
});

/* ── SERVICE WORKER ──────────────────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
  });
}

/* ── INIT ────────────────────────────────────────────────────────────────── */
(function init() {
  // Set default month to most recent with data, or current
  const txs = store.get();
  if (txs.length > 0) {
    state.currentMonth = ym(txs[0].date);
  }
  renderDashboard();
})();
</script>
</body>
